<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الموارد البشرية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h4><i class="fa-solid fa-users me-2"></i>إدارة الموظفين (HR)</h4>
        <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <form method="POST" class="card p-3 shadow-sm">
                <h6>إضافة موظف</h6>
                <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="اسم الموظف" required></div>
                <div class="mb-2"><input type="text" name="position" class="form-control" placeholder="المسمى الوظيفي"></div>
                <div class="mb-2"><input type="number" step="0.01" name="salary" class="form-control" placeholder="الراتب"></div>
                <div class="mb-2"><input type="date" name="hire_date" class="form-control"></div>
                <button class="btn btn-danger w-100">حفظ الموظف</button>
            </form>
        </div>
        <div class="col-md-8">
            <div class="card p-3 shadow-sm">
                <table class="table table-bordered">
                    <thead><tr><th>#</th><th>اسم الموظف</th><th>الوظيفة</th><th>الراتب</th><th>تاريخ التعيين</th></tr></thead>
                    <tbody>
                        {% for emp in employees %}
                        <tr><td>{{emp.id}}</td><td>{{emp.name}}</td><td>{{emp.position}}</td><td>{{emp.salary}}</td><td>{{emp.hire_date}}</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
