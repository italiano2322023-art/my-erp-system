<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الفواتير والمرتجعات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h4><i class="fa-solid fa-file-invoice me-2"></i>معاملات الفواتير ({{ inv_type }})</h4>
        <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
    </div>

    <!-- إضافة فاتورة -->
    <div class="card p-3 shadow-sm mb-4">
        <h6>إدخال فاتورة / مرتجع جديد</h6>
        <form method="POST" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">الجهة (عميل/مورد)</label>
                <select name="entity_id" class="form-select">
                    {% for e in entities %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">المنتج</label>
                <select name="product_id" class="form-select">
                    {% for p in products %}<option value="{{p.id}}">{{p.name}} (المتاح: {{p.quantity}})</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-2"><label class="form-label">الكمية</label><input type="number" name="quantity" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">سعر الوحدة</label><input type="number" step="0.01" name="unit_price" class="form-control" required></div>
            <div class="col-md-2"><label class="form-label">المدفوع</label><input type="number" step="0.01" name="paid_amount" class="form-control" value="0"></div>
            <div class="col-12"><button class="btn btn-primary w-100">حفظ الفاتورة وترحيل الحسابات</button></div>
        </form>
    </div>

    <!-- سجل الفواتير -->
    <div class="card p-3 shadow-sm">
        <h6>سجل الفواتير</h6>
        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr><th>رقم الفاتورة</th><th>الجهة</th><th>الإجمالي</th><th>المدفوع</th><th>التاريخ</th></tr>
            </thead>
            <tbody>
                {% for i in invoices %}
                <tr>
                    <td>#{{i.id}}</td><td>{{i.entity_name}}</td><td>{{i.total_amount}}</td><td>{{i.paid_amount}}</td><td>{{i.date}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
