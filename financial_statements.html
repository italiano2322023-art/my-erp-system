<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>القوائم المالية وحساب الأرباح</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h4><i class="fa-solid fa-chart-line me-2"></i>قائمة الدخل والمركز المالي</h4>
        <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
    </div>

    <div class="row g-3">
        <div class="col-md-3">
            <div class="card p-3 text-center bg-success text-white">
                <h6>إجمالي المبيعات</h6>
                <h3>{{ sales }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center bg-danger text-white">
                <h6>إجمالي المشتريات</h6>
                <h3>{{ purchases }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center bg-primary text-white">
                <h6>رصيد الخزائن النقدية</h6>
                <h3>{{ cash_balance }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center bg-dark text-white">
                <h6>صافي الربح التقديري</h6>
                <h3>{{ net_profit }}</h3>
            </div>
        </div>
    </div>
</div>
</body>
</html>
