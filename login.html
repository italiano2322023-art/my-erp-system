<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; background: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-3 text-primary">
            <i class="fa-solid fa-user-shield fa-3x"></i>
        </div>
        <h4 class="fw-bold mb-4">تسجيل الدخول للنظام</h4>
        <form method="POST" action="/login">
            <div class="mb-3 text-end">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="mb-4 text-end">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i>دخول</button>
        </form>
    </div>

</body>
</html>
