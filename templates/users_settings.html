<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المستخدمين والصلاحيات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light p-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4><i class="fa-solid fa-user-gear me-2"></i>إدارة المستخدمين والصلاحيات</h4>
            <a href="/" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-right me-1"></i>الرجوع للوحة التحكم</a>
        </div>

        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">إضافة مستخدم جديد</h5>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">اسم المستخدم</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الصلاحية (الرتبة)</label>
                            <select name="role" class="form-select">
                                <option value="user">مستخدم عادي (User)</option>
                                <option value="admin">مدير نظام (Admin)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">حفظ المستخدم</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-3 shadow-sm">
                    <h5 class="fw-bold mb-3">قائمة المستخدمين الحاليين</h5>
                    <table class="table table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>اسم المستخدم</th>
                                <th>الرتبة</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in users %}
                            <tr>
                                <td>{{ u.id }}</td>
                                <td>{{ u.username }}</td>
                                <td><span class="badge {% if u.role == 'admin' %}bg-danger{% else %}bg-primary{% endif %}">{{ u.role }}</span></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
