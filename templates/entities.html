<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة {{ entity_type }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h4>إدارة {{ entity_type }}</h4>
        <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <form method="POST" class="card p-3 shadow-sm">
                <h6>إضافة جديد</h6>
                <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="الاسم" required></div>
                <div class="mb-2"><input type="text" name="phone" class="form-control" placeholder="الهاتف"></div>
                <div class="mb-2"><input type="text" name="address" class="form-control" placeholder="العنوان"></div>
                <button class="btn btn-primary w-100">حفظ</button>
            </form>
        </div>
        <div class="col-md-8">
            <div class="card p-3 shadow-sm">
                <table class="table table-striped">
                    <thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>العنوان</th></tr></thead>
                    <tbody>
                        {% for e in entities %}
                        <tr><td>{{e.id}}</td><td>{{e.name}}</td><td>{{e.phone}}</td><td>{{e.address}}</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
