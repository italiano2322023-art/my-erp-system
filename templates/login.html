{% extends 'base.html' %}
{% block title %}تسجيل الدخول - نظام ERP المحاسبي{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center vh-100" style="margin-top: -50px;">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4 text-center">
                <i class="fa-solid fa-user-shield text-primary fa-3x mb-3"></i>
                <h3 class="mb-4 fw-bold">تسجيل الدخول للنظام</h3>
                <form method="POST">
                    <div class="mb-3 text-start">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-bold">دخول للنظام</button>
                </form>
                <div class="mt-3 text-muted small">
                    اسم المستخدم الافتراضي: <b>admin</b> | كلمة السر: <b>admin123</b>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
