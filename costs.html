<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>قسم التكاليف الديناميكي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h4><i class="fa-solid fa-calculator me-2"></i>حساب تكاليف المنتجات النهائية</h4>
        <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
    </div>

    <div class="card p-3 shadow-sm mb-4">
        <form method="POST" class="row g-3">
            <div class="col-md-3">
                <label>المنتج النهائي</label>
                <select name="product_id" class="form-select" required>
                    {% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-3"><label>تكلفة المواد الخام</label><input type="number" step="0.01" name="raw_material_cost" class="form-control" value="0"></div>
            <div class="col-md-3"><label>تكلفة العمالة المباشرة</label><input type="number" step="0.01" name="labor_cost" class="form-control" value="0"></div>
            <div class="col-md-3"><label>مصاريف غير مباشرة (Overhead)</label><input type="number" step="0.01" name="overhead_cost" class="form-control" value="0"></div>
            <div class="col-12"><button class="btn btn-dark w-100">حساب وتحديث تكلفة المنتج تلقائياً</button></div>
        </form>
    </div>

    <div class="card p-3 shadow-sm">
        <h6>سجل تكاليف المنتجات</h6>
        <table class="table table-bordered align-middle">
            <thead class="table-dark">
                <tr><th>المنتج</th><th>المواد الخام</th><th>العمالة</th><th>المصاريف</th><th>التكلفة الإجمالية</th><th>سعر البيع</th></tr>
            </thead>
            <tbody>
                {% for c in costs %}
                <tr><td>{{c.product_name}}</td><td>{{c.raw_material_cost}}</td><td>{{c.labor_cost}}</td><td>{{c.overhead_cost}}</td><td class="fw-bold text-danger">{{c.total_cost}}</td><td class="text-success">{{c.sell_price}}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
